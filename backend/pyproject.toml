[project]
name = "fintech-demo-backend"
version = "0.1.0"
description = "FintechDemo backend API and AI Compliance Copilot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.3.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live_eval: runs live Gemini API evaluations against seeded pgvector SOPs",
]

[tool.ruff]
target-version = "py312"
line-length = 100
